<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSH 安全足迹</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <div class="content-wrapper">
      <!-- 1. 顶部 Header -->
      <header class="app-header">
        <div class="header-left">
          <div class="title-row">
            <h1 class="main-title">SSH 安全足迹</h1>
            <span class="mock-badge" id="mockBadge" hidden>模拟数据</span>
          </div>
          <p class="sub-title">了解谁曾尝试登录你的服务器 · 本地日志安全审计</p>
        </div>

        <div class="header-right">
          <div class="segmented-control" id="rangeControl">
            <button class="seg-btn" data-range="24h">24小时</button>
            <button class="seg-btn active" data-range="7d">7天</button>
            <button class="seg-btn" data-range="30d">30天</button>
          </div>

          <button class="action-btn scan-btn" id="scanBtn">
            <svg id="scanIcon" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"></path>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            <span id="scanBtnText">重新扫描</span>
          </button>
        </div>
      </header>

      <!-- 错误或权限受限警告 -->
      <div class="error-banner" id="errorBanner" hidden>
        <div class="banner-content">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="errorText"></span>
        </div>
        <button class="retry-btn" id="retryBtn">重试</button>
      </div>

      <!-- Tab 切换 -->
      <div class="tab-bar" id="tabBar" role="tablist">
        <div class="tab-indicator" id="tabIndicator"></div>
        <button class="tab-btn active" data-tab="overview" role="tab">概览</button>
        <button class="tab-btn" data-tab="sources" role="tab">
          重点关注的来源
          <span class="tab-badge" id="tabBadge" hidden></span>
        </button>
      </div>

      <div class="tab-panels">
      <!-- ========== Panel 1: 概览 ========== -->
      <div class="tab-panel active" data-panel="overview">
      <!-- 2. 数据概览卡片 -->
      <div class="overview-grid">
        <div class="overview-card card-failed">
          <div class="card-meta">
            <span class="card-label">认证失败</span>
            <span class="card-desc">非法密码或无效账号</span>
          </div>
          <div class="card-number num-failed" id="statFailed">0</div>
        </div>

        <div class="overview-card card-success">
          <div class="card-meta">
            <span class="card-label">成功认证</span>
            <span class="card-desc">密码或公钥登录</span>
          </div>
          <div class="card-number num-success" id="statSuccess">0</div>
        </div>

        <div class="overview-card card-ips">
          <div class="card-meta">
            <span class="card-label">来源 IP</span>
            <span class="card-desc">去重登录活动源</span>
          </div>
          <div class="card-number num-ips" id="statIps">0</div>
        </div>
      </div>

      <!-- 3. 红绿双色登录活动柱状图 -->
      <div class="chart-container">
        <div class="chart-header">
          <div class="title-wrap">
            <h3 class="chart-title">登录活动时间分布</h3>
            <span class="chart-subtitle">双色对比统计</span>
          </div>
          <div class="legend">
            <div class="legend-item">
              <span class="legend-dot dot-failed"></span>
              <span class="legend-text">认证失败</span>
            </div>
            <div class="legend-item">
              <span class="legend-dot dot-success"></span>
              <span class="legend-text">成功认证</span>
            </div>
          </div>
        </div>

        <div class="svg-wrapper" id="chartWrapper">
          <svg id="chartSvg" viewBox="0 0 1000 180" preserveAspectRatio="none" class="chart-svg">
            <g class="grid-lines">
              <line x1="0" y1="20" x2="1000" y2="20" class="grid-line"></line>
              <line x1="0" y1="85" x2="1000" y2="85" class="grid-line"></line>
              <line x1="0" y1="150" x2="1000" y2="150" class="base-line"></line>
            </g>
            <g class="bars-layer" id="barsLayer"></g>
          </svg>

          <div class="x-axis-labels" id="axisLabels"></div>

          <div class="chart-tooltip" id="chartTooltip" hidden>
            <div class="tt-time" id="ttTime"></div>
            <div class="tt-row">
              <span class="tt-dot dot-failed"></span>
              <span class="tt-label">认证失败</span>
              <span class="tt-val val-failed" id="ttFailed">0</span>
            </div>
            <div class="tt-row">
              <span class="tt-dot dot-success"></span>
              <span class="tt-label">认证成功</span>
              <span class="tt-val val-success" id="ttSuccess">0</span>
            </div>
          </div>
        </div>
      </div>

      </div>

      <!-- ========== Panel 2: 重点关注的来源 ========== -->
      <div class="tab-panel" data-panel="sources">
      <section class="section-container">
        <div class="section-header">
          <div class="section-title-wrap">
            <h3 class="section-title">重点关注的来源</h3>
            <span class="section-count" id="sectionCount"></span>
          </div>

          <div class="filter-tools">
            <!-- 标签筛选下拉 -->
            <div class="select" id="tagSelect">
              <button class="select-trigger" id="tagSelectTrigger" type="button">
                <span class="select-value" id="tagSelectValue">全部标签</span>
                <svg class="select-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
              <div class="select-menu" id="tagSelectMenu" hidden></div>
            </div>

          <div class="search-box" id="searchBox">
            <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
            <input
              id="searchInput"
              class="search-input"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="搜索 IP 地址"
            />
            <button class="search-clear" id="searchClear" title="清空" hidden>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </div>
          </div>
        </div>

        <div class="ip-list" id="ipList"></div>
      </section>
      </div>
      </div>
      </div>
    </div>

    <!-- 右侧详情抽屉 -->
    <div class="drawer-overlay" id="drawerOverlay" hidden>
      <div class="drawer-panel">
        <div class="drawer-header">
          <div class="header-left">
            <div class="ip-title-wrap">
              <span class="ip-title" id="drawerIp"></span>
              <span class="risk-badge" id="drawerBadge"></span>
            </div>
            <span class="ip-subtitle">SSH 来源分析与审计取证</span>
          </div>
          <button class="close-btn" id="drawerClose">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="drawer-body" id="drawerBody">
          <div class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">失败认证</span>
              <span class="stat-value val-failed" id="drawerFailed">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">成功认证</span>
              <span class="stat-value val-success" id="drawerSuccess">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">尝试账号数</span>
              <span class="stat-value" id="drawerUserCount">0</span>
            </div>
          </div>

          <div class="section-box">
            <h4 class="section-title">活动时间范围</h4>
            <div class="info-row">
              <span class="info-label">首次出现</span>
              <span class="info-val" id="drawerFirst"></span>
            </div>
            <div class="info-row">
              <span class="info-label">末次活动</span>
              <span class="info-val" id="drawerLast"></span>
            </div>
          </div>

          <div class="section-box">
            <h4 class="section-title">尝试登录的用户名</h4>
            <div class="users-chips" id="drawerUsers"></div>
          </div>

          <div class="section-box">
            <h4 class="section-title">风险判定依据</h4>
            <div class="reasons-list" id="drawerReasons"></div>
          </div>

          <div class="section-box logs-box">
            <div class="logs-header">
              <h4 class="section-title">SSH 原始日志记录 (只读)</h4>
              <span class="logs-count" id="drawerLogsCount"></span>
            </div>
            <div class="logs-container" id="drawerLogs"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/gm-sdk.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/mock.js"></script>
    <script src="./js/chart.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
